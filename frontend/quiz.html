<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Practice test — StudyLens</title>
  <meta name="description" content="Timed, exam-style practice test with instant scoring, level assignment and weak-topic detection." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <header class="topbar"><div class="topbar-inner" data-nav></div></header>

  <main class="page quiz-wrap">
    <!-- intro -->
    <section class="card quiz-intro" id="quiz-intro">
      <div class="big" id="intro-icon" aria-hidden="true"></div>
      <p class="eyebrow" id="intro-eyebrow">Practice test</p>
      <h1 id="intro-title">…</h1>
      <p class="lede" id="intro-lede" style="margin:0 auto;max-width:46ch">Exam-style questions, timed and graded instantly. Your result updates your level and weak topics.</p>
      <div class="quiz-facts">
        <div class="quiz-fact"><b id="fact-q">—</b><span>Questions</span></div>
        <div class="quiz-fact"><b id="fact-t">—</b><span>Minutes</span></div>
        <div class="quiz-fact"><b id="fact-l">—</b><span>Your level</span></div>
      </div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn--primary btn--lg" id="start-btn">Start test</button>
        <a class="btn btn--ghost" id="cancel-link" href="dashboard.html">Not now</a>
      </div>
    </section>

    <!-- test -->
    <section id="quiz-test" hidden>
      <div class="quiz-bar">
        <span class="timer" id="timer" aria-live="off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span id="timer-text">--:--</span>
        </span>
        <div class="meter" aria-hidden="true"><span id="progress" style="width:0%"></span></div>
        <span class="chip" id="answered-count">0 / 0</span>
      </div>

      <div class="card q-card">
        <div class="q-meta">
          <span class="chip chip--accent" id="q-number">Question 1</span>
          <span class="chip" id="q-topic"></span>
          <span class="chip chip--amber" id="q-level"></span>
        </div>
        <p class="q-text" id="q-text">…</p>
        <div class="q-opts" id="q-opts" role="radiogroup" aria-label="Answer options"></div>

        <div class="q-dots" id="q-dots" aria-label="Question navigator"></div>

        <div class="quiz-nav">
          <button class="btn btn--ghost" id="prev-btn">Previous</button>
          <span class="spacer"></span>
          <button class="btn btn--ghost" id="clear-btn">Clear</button>
          <button class="btn btn--ink" id="next-btn">Next</button>
          <button class="btn btn--primary" id="submit-btn">Submit test</button>
        </div>
      </div>
      <p style="margin-top:14px;font-size:.78rem;color:var(--muted);text-align:center">
        Tip: press keys <b>1–4</b> to answer, <b>←</b> / <b>→</b> to move. Answers stay in this session and are saved to your profile on submit.
      </p>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/quiz-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
