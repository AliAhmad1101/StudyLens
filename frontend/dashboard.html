<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — StudyLens</title>
  <meta name="description" content="Your StudyLens dashboard: streak, subjects, today’s focus subject, personalised resources and daily plan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <header class="topbar"><div class="topbar-inner" data-nav></div></header>

  <main class="page">
    <div class="dash-head">
      <div>
        <p class="eyebrow" id="dash-greeting">Welcome back</p>
        <h1 id="dash-name">…</h1>
      </div>
      <p class="date" id="dash-date"></p>
    </div>

    <!-- focus subject of the day -->
    <section class="focus-card" aria-labelledby="focus-title">
      <div class="focus-body">
        <span class="chip chip--accent" id="focus-chip">Focus subject</span>
        <h2 id="focus-title" style="margin-top:12px">…</h2>
        <p class="lede" id="focus-desc"></p>
        <div class="btn-row">
          <a class="btn btn--ink" id="focus-go" href="subject.html">Open subject</a>
          <a class="btn btn--ghost" id="focus-quiz" href="quiz.html">Take practice test</a>
        </div>
      </div>
      <div class="focus-art" id="focus-art" aria-hidden="true"></div>
    </section>

    <!-- stats -->
    <div class="section-head"><h2>Your progress</h2></div>
    <div class="stat-grid" id="dash-stats"><!-- built by dashboard.js --></div>

    <!-- daily plan -->
    <div class="section-head">
      <h2>Today’s plan</h2>
      <a href="settings.html">Adjust time budget</a>
    </div>
    <div class="card">
      <ul class="plan-list" id="dash-plan"></ul>
    </div>

    <!-- recommended -->
    <div class="section-head">
      <h2>Recommended for you</h2>
      <span class="chip chip--accent" id="rec-why">Ranked by your profile</span>
    </div>
    <div class="rec-strip" id="dash-recs"></div>

    <!-- subjects -->
    <div class="section-head">
      <h2>Subjects you track</h2>
      <a href="subject.html">Browse all</a>
    </div>
    <div class="subj-grid" id="dash-subjects"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/quiz-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
