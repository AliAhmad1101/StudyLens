<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subjects — StudyLens</title>
  <meta name="description" content="Browse a subject: personalised resources, practice test and a suggested study plan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <header class="topbar"><div class="topbar-inner" data-nav></div></header>

  <main class="page">
    <!-- picker view: shown when no ?subject= is given -->
    <section id="picker">
      <p class="eyebrow">All subjects</p>
      <h1>Pick a subject</h1>
      <p class="lede">Every subject page ranks its resources against your profile — weak topics and learning style first.</p>
      <div class="subj-grid" id="picker-grid" style="margin-top:26px"></div>
    </section>

    <!-- detail view -->
    <section id="detail" hidden>
      <a href="dashboard.html" class="btn btn--ghost btn--sm" style="margin-bottom:22px" id="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Dashboard
      </a>

      <div class="subj-hero">
        <div>
          <span class="chip chip--accent" id="subj-exam"></span>
          <h1 id="subj-name" style="margin-top:12px"></h1>
          <p class="lede" id="subj-desc"></p>
          <div class="chip-row" id="subj-tags" style="margin:16px 0 22px"></div>
          <div class="btn-row">
            <a class="btn btn--primary btn--lg" id="cta-quiz" href="#">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 5.5v13l11-6.5z"/></svg>
              Take practice test
            </a>
            <a class="btn btn--ghost" id="cta-plan" href="#plan">View study plan</a>
          </div>
        </div>
        <div class="subj-hero-art" id="subj-art" aria-hidden="true"></div>
      </div>

      <hr class="divider" />

      <div class="section-head" style="margin-top:0">
        <h2>Resources</h2>
        <div class="filter-bar" id="filters" role="tablist" aria-label="Filter resources by type">
          <button class="filter-btn is-on" data-filter="all" role="tab" aria-selected="true">All</button>
          <button class="filter-btn" data-filter="video" role="tab" aria-selected="false">Videos</button>
          <button class="filter-btn" data-filter="article" role="tab" aria-selected="false">Articles</button>
          <button class="filter-btn" data-filter="pdf" role="tab" aria-selected="false">PDFs</button>
          <span class="filter-count" id="filter-count"></span>
        </div>
      </div>
      <div class="res-grid" id="res-grid"></div>

      <div class="section-head" id="plan">
        <h2>Suggested study plan</h2>
        <a href="settings.html">Change daily time</a>
      </div>
      <div class="card">
        <p style="margin-top:0;font-size:.9rem" id="plan-blurb"></p>
        <ul class="plan-list" id="plan-list"></ul>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/quiz-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/subject.js"></script>
</body>
</html>
